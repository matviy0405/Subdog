<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тести — Subdog</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .t {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 8px;
      padding: 10px 0;
      border-top: 1px solid #2d2350;
    }

    .t .ok {
      color: #4ade80;
      font-weight: 800;
    }

    .t .fail {
      color: #f87171;
      font-weight: 800;
    }

    .t small {
      display: block;
      color: #a79ccb;
    }

    .sum {
      font-size: 20px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p><a href="index.html">← На сайт</a></p>
    <h1>Тести Subdog</h1>
    <p class="muted">Автоматична перевірка сценаріїв із завдання тестувальника. Усе виконується в браузері, без встановлення.</p>
    <div class="card">
      <p class="sum" id="sum">Виконується…</p>
      <div id="out"></div>
    </div>
  </main>
  <script src="data/catalog.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/tests.js"></script>
</body>
</html>
