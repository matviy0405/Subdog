<html lang="uk">
<head>
  <meta charset="utf-8">

  <style>
    .t { display: grid; grid-template-columns: 32px 1fr; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }

    .sum { font-size: 1.2rem; font-weight: 800; }
  </style>
</head>
<body>
  <main><div class="wrap">
    <p><a href="index.html">← На сайт</a></p>
    <h1>Тести Subdog</h1>

    <div class="card"><p class="sum" id="sum">Виконується…</p><div id="out"></div></div>
  </div></main>
  <script src="data/catalog.js"></script>
  <script src="js/calc.js"></script>
